
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #fff8e8;
      color: #493b2a;
      text-align: center;
      font-size: 18px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      padding: 28px 12px 20px;
    }

    .top-emoji {
      font-size: 64px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 6vw, 44px);
      color: #75501e;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.7;
      color: #78664e;
      word-break: keep-all;
    }

    .panel {
      background: #ffffff;
      border: 2px solid #f3dfaa;
      border-radius: 24px;
      padding: 28px 22px;
      margin: 18px 0;
      box-shadow: 0 5px 16px rgba(128, 94, 32, 0.07);
    }

    h2 {
      font-size: 26px;
      margin: 0 0 12px;
      color: #77521f;
    }

    .hint {
      color: #88765e;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .mbti-button {
      border: 2px solid #f0d99e;
      border-radius: 14px;
      padding: 17px 4px;
      background: #fff9e9;
      color: #67491e;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .mbti-button:hover {
      background: #ffe7a3;
      transform: translateY(-2px);
    }

    .mbti-button:focus-visible,
    .again-button:focus-visible {
      outline: 3px solid #8b672c;
      outline-offset: 3px;
    }

    .hidden {
      display: none;
    }

    .result-type {
      display: inline-block;
      background: #ffedb5;
      color: #76521b;
      border-radius: 30px;
      padding: 9px 22px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .pokemon-emoji {
      font-size: clamp(100px, 22vw, 150px);
      line-height: 1.5;
      margin: 8px 0;
    }

    .pokemon-name {
      font-size: clamp(30px, 6vw, 40px);
      font-weight: bold;
      color: #68471b;
      margin: 4px 0 20px;
    }

    .reason-box {
      background: #fff8e6;
      border-radius: 18px;
      padding: 20px;
      margin: 16px 0;
      text-align: left;
      line-height: 1.9;
      font-size: 19px;
      word-break: keep-all;
    }

    .section-title {
      font-size: 22px;
      font-weight: bold;
      color: #77521f;
      margin: 24px 0 12px;
    }

    .compatibility {
      display: inline-block;
      background: #e9f5d8;
      color: #3e692e;
      padding: 13px 28px;
      border-radius: 18px;
      font-size: 25px;
      font-weight: bold;
    }

    .compatibility-note {
      color: #756c5a;
      line-height: 1.7;
      font-size: 17px;
      margin-top: 12px;
    }

    .again-button {
      border: none;
      background: #f2c653;
      color: #513811;
      font-size: 21px;
      font-weight: bold;
      border-radius: 15px;
      padding: 17px 32px;
      margin-top: 22px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d5a83c;
    }

    .again-button:hover {
      background: #ffda71;
    }

    .again-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d5a83c;
    }

    footer {
      color: #98866c;
      font-size: 15px;
      line-height: 1.7;
      margin: 28px 0 10px;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px 10px;
      }

      .panel {
        padding: 22px 14px;
      }

      .mbti-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }

      .mbti-button {
        padding: 15px 1px;
        font-size: 17px;
        border-radius: 10px;
      }

      .reason-box {
        padding: 16px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="top-emoji" aria-hidden="true">⚡🐾</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <div class="subtitle">
        나와 닮은 포켓몬은 누구일까요?<br>
        나의 MBTI를 선택하고 단짝 포켓몬을 만나 보세요!
      </div>
    </header>

    <!-- MBTI 선택 화면 -->
    <section id="select-screen" class="panel">
      <h2>🌟 나의 MBTI를 선택하세요</h2>
      <p class="hint">
        16가지 유형 중 나에게 해당하는 버튼을 눌러 주세요.
      </p>

      <div class="mbti-grid" id="mbti-grid">
        <button class="mbti-button" data-mbti="ISTJ">ISTJ</button>
        <button class="mbti-button" data-mbti="ISFJ">ISFJ</button>
        <button class="mbti-button" data-mbti="INFJ">INFJ</button>
        <button class="mbti-button" data-mbti="INTJ">INTJ</button>

        <button class="mbti-button" data-mbti="ISTP">ISTP</button>
        <button class="mbti-button" data-mbti="ISFP">ISFP</button>
        <button class="mbti-button" data-mbti="INFP">INFP</button>
        <button class="mbti-button" data-mbti="INTP">INTP</button>

        <button class="mbti-button" data-mbti="ESTP">ESTP</button>
        <button class="mbti-button" data-mbti="ESFP">ESFP</button>
        <button class="mbti-button" data-mbti="ENFP">ENFP</button>
        <button class="mbti-button" data-mbti="ENTP">ENTP</button>

        <button class="mbti-button" data-mbti="ESTJ">ESTJ</button>
        <button class="mbti-button" data-mbti="ESFJ">ESFJ</button>
        <button class="mbti-button" data-mbti="ENFJ">ENFJ</button>
        <button class="mbti-button" data-mbti="ENTJ">ENTJ</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="panel hidden" aria-live="polite">
      <div class="result-type" id="result-type">나의 MBTI</div>

      <h2>🎉 당신의 단짝 포켓몬은?</h2>

      <div class="pokemon-emoji" id="pokemon-emoji" role="img"
           aria-label="포켓몬 이모지">⚡</div>

      <div class="pokemon-name" id="pokemon-name">피카츄</div>

      <div class="section-title">💛 우리 둘이 닮은 이유</div>
      <div class="reason-box" id="pokemon-reason"></div>

      <div class="section-title">🤝 나와 잘 맞는 MBTI</div>
      <div class="compatibility" id="compatible-mbti"></div>
      <div class="compatibility-note">
        서로 다른 매력을 이해하고 존중하면<br>
        더욱 즐거운 단짝이 될 수 있어요!
      </div>

      <button class="again-button" id="again-button">
        ↩ 다시 고르기
      </button>
    </section>

    <footer>
      ※ 포켓몬 매칭과 MBTI 궁합은 재미를 위한 창작 결과입니다.<br>
      실제 성격이나 관계를 과학적으로 판정하는 검사는 아니에요.
    </footer>

  </div>

  <script>
    // MBTI별 포켓몬, 어울리는 이유, 궁합 유형
    const pokemonData = {
      ISTJ: {
        pokemon: "잠만보",
        emoji: "😴",
        reason: [
          "차분하고 신중한 ISTJ는 계획과 규칙을 중요하게 생각해요.",
          "잠만보처럼 자기만의 페이스를 지키며 묵묵히 할 일을 해내는 모습이 잘 어울려요."
        ],
        compatible: "ESFP"
      },

      ISFJ: {
        pokemon: "이브이",
        emoji: "🦊",
        reason: [
          "ISFJ는 주변 사람을 세심하게 챙기는 따뜻한 성격이에요.",
          "다양한 모습으로 성장하는 이브이처럼 소중한 사람과 함께하며 특별한 매력을 보여 줘요."
        ],
        compatible: "ESFP"
      },

      INFJ: {
        pokemon: "루카리오",
        emoji: "🐺",
        reason: [
          "INFJ는 다른 사람의 마음을 깊이 이해하려고 노력해요.",
          "상대의 기운을 감지하는 루카리오처럼 섬세한 감각과 강한 신념을 지닌 모습이 닮았어요."
        ],
        compatible: "ENFP"
      },

      INTJ: {
        pokemon: "뮤츠",
        emoji: "🧬",
        reason: [
          "INTJ는 큰 그림을 바라보고 논리적으로 계획하는 것을 좋아해요.",
          "강력한 지능을 가진 뮤츠처럼 독립적으로 생각하고 자신만의 목표를 추구하는 모습이 어울려요."
        ],
        compatible: "ENFP"
      },

      ISTP: {
        pokemon: "메타몽",
        emoji: "🟣",
        reason: [
          "ISTP는 직접 관찰하고 실험하며 문제를 해결하는 데 능숙해요.",
          "다양한 모습으로 변신하는 메타몽처럼 상황에 맞게 유연하게 대처하는 매력이 있어요."
        ],
        compatible: "ESFJ"
      },

      ISFP: {
        pokemon: "치코리타",
        emoji: "🌱",
        reason: [
          "ISFP는 자신만의 감성과 취향을 소중하게 생각해요.",
          "부드럽고 다정한 치코리타처럼 평화로운 분위기를 좋아하고 주변에 편안함을 전해 줘요."
        ],
        compatible: "ENFJ"
      },

      INFP: {
        pokemon: "피카츄",
        emoji: "⚡",
        reason: [
          "INFP는 자신만의 가치와 상상력을 중요하게 생각해요.",
          "친구를 아끼는 피카츄처럼 진심으로 마음을 나누고 소중한 존재를 지키려는 모습이 닮았어요."
        ],
        compatible: "ENFJ"
      },

      INTP: {
        pokemon: "후딘",
        emoji: "🥄",
        reason: [
          "INTP는 새로운 지식을 탐구하고 원리를 알아가는 것을 좋아해요.",
          "뛰어난 지능을 가진 후딘처럼 호기심이 많고 복잡한 문제를 깊이 생각하는 모습이 어울려요."
        ],
        compatible: "ENTJ"
      },

      ESTP: {
        pokemon: "리자몽",
        emoji: "🔥",
        reason: [
          "ESTP는 직접 도전하고 경험하면서 배우는 것을 좋아해요.",
          "힘차게 날아오르는 리자몽처럼 자신감이 넘치고 활동적인 에너지를 발휘해요."
        ],
        compatible: "ISFJ"
      },

      ESFP: {
        pokemon: "푸린",
        emoji: "🎤",
        reason: [
          "ESFP는 사람들과 어울리고 즐거운 분위기를 만드는 것을 좋아해요.",
          "노래로 사람들의 관심을 사로잡는 푸린처럼 주변을 즐겁게 만드는 매력이 있어요."
        ],
        compatible: "ISFJ"
      },

      ENFP: {
        pokemon: "파치리스",
        emoji: "🐿️",
        reason: [
          "ENFP는 새로운 아이디어와 신나는 경험을 좋아해요.",
          "활발하고 장난기 많은 파치리스처럼 호기심이 넘치고 주변에 밝은 에너지를 전해 줘요."
        ],
        compatible: "INFJ"
      },

      ENTP: {
        pokemon: "팬텀",
        emoji: "👻",
        reason: [
          "ENTP는 기발한 아이디어를 내고 새로운 가능성을 탐색하는 것을 좋아해요.",
          "장난기 넘치는 팬텀처럼 틀에 얽매이지 않고 재치 있는 방식으로 상황을 바꾸는 모습이 닮았어요."
        ],
        compatible: "INTJ"
      },

      ESTJ: {
        pokemon: "괴력몬",
        emoji: "💪",
        reason: [
          "ESTJ는 목표를 정하고 체계적으로 일을 진행하는 데 강점이 있어요.",
          "강한 힘을 가진 괴력몬처럼 책임감을 가지고 앞장서서 일을 해결하는 모습이 잘 어울려요."
        ],
        compatible: "ISFP"
      },

      ESFJ: {
        pokemon: "푸린",
        emoji: "🎵",
        reason: [
          "ESFJ는 주변 사람들과 조화를 이루고 함께하는 시간을 소중히 여겨요.",
          "노래로 분위기를 바꾸는 푸린처럼 사람들을 즐겁게 하고 화목한 관계를 만드는 매력이 있어요."
        ],
        compatible: "ISTP"
      },

      ENFJ: {
        pokemon: "가디",
        emoji: "🐕",
        reason: [
          "ENFJ는 다른 사람을 격려하고 함께 성장하는 것을 중요하게 생각해요.",
          "충직하고 용감한 가디처럼 친구를 아끼고 주변 사람에게 든든한 힘이 되어 줘요."
        ],
        compatible: "INFP"
      },

      ENTJ: {
        pokemon: "망나뇽",
        emoji: "🐉",
        reason: [
          "ENTJ는 목표를 향해 전략적으로 움직이고 일을 이끄는 것을 좋아해요.",
          "강력하면서도 책임감 있는 망나뇽처럼 큰 목표를 추구하면서 주변을 이끄는 모습이 닮았어요."
        ],
        compatible: "INTP"
      }
    };

    const selectScreen = document.getElementById("select-screen");
    const resultScreen = document.getElementById("result-screen");

    const resultType = document.getElementById("result-type");
    const pokemonEmoji = document.getElementById("pokemon-emoji");
    const pokemonName = document.getElementById("pokemon-name");
    const pokemonReason = document.getElementById("pokemon-reason");
    const compatibleMbti = document.getElementById("compatible-mbti");

    // MBTI 버튼을 누르면 해당 포켓몬 결과를 표시
    document.querySelectorAll(".mbti-button").forEach(function(button) {
      button.addEventListener("click", function() {
        const mbti = button.dataset.mbti;
        showResult(mbti);
      });
    });

    function showResult(mbti) {
      const data = pokemonData[mbti];

      if (!data) {
        return;
      }

      resultType.textContent = "나의 MBTI: " + mbti;
      pokemonEmoji.textContent = data.emoji;
      pokemonName.textContent = data.pokemon;

      // 이유를 두 문단으로 표시
      pokemonReason.replaceChildren();

      data.reason.forEach(function(sentence) {
        const paragraph = document.createElement("p");
        paragraph.textContent = sentence;
        paragraph.style.margin = "0 0 10px";
        pokemonReason.appendChild(paragraph);
      });

      compatibleMbti.textContent = data.compatible;

      // 선택 화면을 숨기고 결과 화면 표시
      selectScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      // 결과 화면의 시작 부분으로 이동
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // 다시 고르기 버튼
    document.getElementById("again-button").addEventListener("click", function() {
      resultScreen.classList.add("hidden");
      selectScreen.classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
